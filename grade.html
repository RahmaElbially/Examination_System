<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/grade.css">
</head>
<body class="d-flex justify-content-center align-items-center flex-column p-5">

    <div class="container">
        <div class="success shadow-lg d-flex justify-content-center align-items-center flex-column">
            <h2>Result</h2>
            <img alt="success">
        <div class="circle-container">
            <div class="percentage-text">0%</div>
        </div>
            <p class="text-center fs-3 con"></p>
            <p class="text-center fs-3 fail"></p>
            <span class="res fs-4 text-capitalize text-center"></span>
        </div>
    </div>
    
    <script src="JS/grade.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>
