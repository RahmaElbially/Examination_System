<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    li{
        cursor: pointer;
    }
</style>
<body>
    
   <section>
        <!-- <div>
            <h2>examName</h2>
            <p>question</p>
            <ul>
                <li>option</li>
                <li>option</li>
                <li>option</li>
                <li>option</li>
            </ul>
        </div> -->
   </section>

    <script>
        let section = document.querySelector("section");
        async function fetchData() {
            try {
                const response = await fetch('questions.json'); 
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`); 
                }
                const data = await response.json(); 
                console.log(data);
                const h2 = document.createElement("h2");
                h2.textContent = data.examName;
                section.appendChild(h2);

                data.questions.forEach((question)=>{
                    const div = document.createElement("div"); // إنشاء div لكل سؤال
                    const p = document.createElement("p");
                    p.textContent = question.questionTitle; 
                    div.appendChild(p); 

                    const ul = document.createElement("ul"); // إنشاء قائمة جديدة للإجابات
                    question.answers.forEach((answer) => {
                        const li = document.createElement("li"); // إنشاء عنصر <li> جديد لكل إجابة
                        li.textContent = answer.option;
                        ul.appendChild(li);
                        li.addEventListener("click",(event)=>{
                            if(question.correctAnswerId === answer.id){
                                console.log("True");
                            }else{
                                console.log("False");
                            }
                        })
                    });

                    div.appendChild(ul); // إضافة القائمة إلى div
                    section.appendChild(div)
                })
            } catch (error) {
                console.error('Error fetching data:', error); 
            }
        }
        fetchData(); 


    </script>
</body>
</html>
