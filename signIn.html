<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="CSS/signIn.css">
</head>

<body class="py-5 d-flex justify-content-center align-items-center flex-column">
    <div class="container">
        <div class="row">
           <div class="left col-12 col-lg-6">
               <img src="Images/Online test.gif" alt="">
           </div>

            <form class="right col-12 col-lg-6">
                <h2 class="mb-3">Welcome Back</h2>
                <div class="d-flex flex-column">
                    <label>Email</label>
                    <input type="email" id="loginEmail">
                    <p class="emailErr">This Field Is Required</p>
                </div>

                <div class="d-flex flex-column position-relative pas">
                    <label>Password</label>
                    <input type="password" id="loginPass" class="form-control">
                    <i class="fa-solid fa-eye-slash position-absolute me-3" id="togglePassword"></i>
                    <p class="passErr">This Field Is Required</p>
                </div>

                <div class="d-flex justify-content-center">
                    <input type="submit" class="submit-btn" id="login" value="Login">
                </div>

                <p class="account">Don't have account ?<a href="signUp.html">Sign up</a></p>
            </form> 
        </div>
    </div>
   
    <script src="JS/signIn.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>
