<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center py-5">
    
    <section class="container p-0">
        <div class="row">
            <div class="col-12 col-md-8 col-lg-9 mb-5 mb-md-0 ">
                <div class="exam-content">
                    <div class="timer d-flex align-items-center">
                        <i class="fa-regular fa-clock"></i>
                        <!-- <span>04</span><span>:59</span> -->
                        <div class="time me-3">04:59</div>
                    </div> <!-- End Timer -->

                    <h2>Choose The Correct Answer</h2>

                    <div class="question">
                        <p class="question-title">
                            What Is HTML Stands For ?
                            <i class="fa-solid fa-flag"></i>
                        </p> <!-- End Question Title -->

                        <ul class="options">
                            <li>Hyper Text Markub Language</li>
                            <li>Hyper Text Mar Language</li>
                            <li>Hyperd Text Markub Language</li>
                            <li>Hyper Text Markub Learning</li>
                        </ul> <!-- End Options -->
                    </div> <!-- End Questions -->

                    <div class="questions-number d-flex flex-column flex-sm-row
                        justify-content-between align-items-center mt-4">
                       <div class="left mx-auto mb-4 mb-sm-0">
                            <i class="fa-solid fa-chevron-left"></i>
                            <span class="numbers">
                                <span class="first-num">1</span> 
                                Out Of 
                                <span class="last-num">10</span>
                            </span>
                            <i class="fa-solid fa-chevron-right"></i>
                       </div>

                       <div class="right">
                            <button>Submit</button>
                        </div> <!-- End Right -->
                    </div> <!-- End Questions Number -->
                </div> <!-- End Exam Content -->
            </div>

            <div class="col-12 col-md-4 col-lg-3">
                <div class="flag-content">
                    <h2>Marked Questions</h2>
                    <div class="line"></div>
                    <div class="question d-flex justify-content-between align-items-center mt-4">
                        What Is HTML Stands For ?
                        <i class="fa-solid fa-trash"></i>
                    </div> <!-- End Question -->

                </div> <!-- End Flag Content -->
            </div>
        </div>
    </section>

    <script src="JS/main.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>
