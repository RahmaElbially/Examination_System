<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="CSS/signIn.css">
</head>
<body class="py-5">
    <div class="container mt-5">
        <div class="row">
           <div class="left col-12 col-lg-6 p-5">
               <img src="Images/Online test.gif" alt="">
           </div>
           <div class="right col-12 col-lg-6">
            <h2 class="mb-3">Welcome Back</h2>
               <form action="">
                <div class="d-flex flex-column">
                    <label for="" class="my-2">Email</label>
                    <input type="email" name="" id="loginEmail">
                    <div class="emailErr"></div>
                </div>
                <div class="d-flex flex-column position-relative pas">
                    <label for="" class="my-2">Password</label>
                    <input type="password" id="loginPass" class="form-control">
                    <i class="fa-solid fa-eye position-absolute cursor-pointer" id="togglePassword"></i>
                    <div class="passErr"></div>
                </div>
                <div class="d-flex justify-content-center">
                    <button type="submit" class="submit-btn mt-5" id="login">Login</button>
                    <!-- <div class="subErr"></div> -->
                </div>
                <p class="account mt-3">Do you have acount?<a href="signUp.html">Sign up</a></p>
               </form> 
           </div>
        </div>
    </div>
   
    <script>
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("loginPass");

        togglePassword.addEventListener("click", () => {
            const type = passwordInput.type === "password" ? "text" : "password";
            passwordInput.type = type;

            togglePassword.classList.toggle("fa-eye");
            togglePassword.classList.toggle("fa-eye-slash");
        });
    </script>
    <script src="JS/signIn.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>
